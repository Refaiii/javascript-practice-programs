<!DOCTYPE html>
<html>
<head>
    <title>Character Shifter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <h1>Character Shifter</h1>

    <p>Shift every letter by one.</p>

    <input
        type="text"
        id="textInput"
        placeholder="Enter text"
    >

    <div class="buttons">
        <button onclick="shiftCharacters()">Shift</button>
        <button class="clear-btn" onclick="clearResult()">Clear</button>
    </div>

    <h2 id="result"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
