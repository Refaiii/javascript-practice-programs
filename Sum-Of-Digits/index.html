<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Digits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <h1>Sum of Digits</h1>

    <p>Enter any number and find the sum of its digits.</p>

    <input
        type="number"
        id="numberInput"
        placeholder="Enter a number"
    >

    <div class="buttons">
        <button onclick="sumDigits()">Calculate</button>
        <button class="clear-btn" onclick="clearResult()">Clear</button>
    </div>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
