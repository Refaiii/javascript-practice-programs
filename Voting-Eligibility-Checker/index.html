<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Eligibility Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Voting Eligibility Checker</h1>
        <p>Enter your age to check voting eligibility.</p>

        <input
            type="text"
            id="ageInput"
            placeholder="Enter your age"
        >

        <div class="buttons">
            <button onclick="checkEligibility()">Check</button>
            <button class="clear-btn" onclick="clearResult()">Clear</button>
        </div>

        <h2 id="result"></h2>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
