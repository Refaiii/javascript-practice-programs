<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <h1>GCD Finder</h1>

    <p>Find the Greatest Common Divisor of two numbers.</p>

    <input
        type="number"
        id="num1"
        placeholder="Enter first number"
    >

    <input
        type="number"
        id="num2"
        placeholder="Enter second number"
    >

    <div class="buttons">
        <button onclick="findGCD()">Find GCD</button>
        <button class="clear-btn" onclick="clearResult()">Clear</button>
    </div>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
