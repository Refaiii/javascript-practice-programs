<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Frequency Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <h1>Character Frequency Counter</h1>

  <p>Enter a word or sentence.</p>

  <input
    type="text"
    id="textInput"
    placeholder="Enter text"
  >

  <div class="buttons">
    <button onclick="countFrequency()">Count Frequency</button>
    <button class="clear-btn" onclick="clearResult()">Clear</button>
  </div>

  <pre id="result"></pre>

</div>

<script src="script.js"></script>

</body>
</html>
