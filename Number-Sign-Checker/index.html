<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Sign Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Number Sign Checker</h1>
            <p>Enter a number to check whether it is Positive, Negative, or Zero.</p>

            <input type="number" id="numberInput" placeholder="Enter a number">

            <div class="buttons">
                <button onclick="checkNumber()">Check Sign</button>
                <button class="clear-btn" onclick="clearResult()">Clear</button>
            </div>

            <h2 id="result"></h2>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
